<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Matrix</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1d2433;--m:#6b7385;--b:#dfe3ea;--a:#2457d6;--al:#e8eefc;--g:#1c8c5a;--w:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--c:#1b202b;--t:#e7eaf1;--m:#98a1b5;--b:#2b3242;--a:#6b94ff;--al:#232c47;--g:#4cc38a;--w:#e0b050}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:17px;margin:0}nav{display:flex;gap:4px}nav button{border:0;background:none;color:var(--m);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}nav button.on{background:var(--al);color:var(--a);font-weight:600}
.sp{flex:1}button.p{background:var(--a);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}button.s{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;align-items:center}
input,select,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:7px 9px;max-width:100%}
.bar input[type=search]{min-width:200px}
.sum{padding:0 16px 8px;color:var(--m)}.sum b{color:var(--t)}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:12px;padding:0 16px 24px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;overflow:hidden}
.scroll{overflow:auto;max-height:calc(100vh - 210px)}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:var(--c);text-align:left;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--b);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--b);vertical-align:top}tr.r{cursor:pointer}tr.r:hover td{background:var(--al)}tr.sel td{background:var(--al)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--al);color:var(--a);font-size:12px;white-space:nowrap}.tag.g{background:transparent;border:1px solid var(--g);color:var(--g)}.tag.w{background:transparent;border:1px solid var(--w);color:var(--w)}
.ph{padding:12px 14px;border-bottom:1px solid var(--b)}.ph h2{margin:0 0 2px;font-size:15px}.m{color:var(--m);font-size:13px}
.ci{padding:8px 14px;border-bottom:1px solid var(--b);display:flex;gap:10px;justify-content:space-between}.ci:last-child{border:0}
.more{padding:10px;text-align:center}
dialog{border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t);width:min(680px,94vw);padding:0}dialog::backdrop{background:rgba(0,0,0,.4)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--m)}.fg .full{grid-column:1/-1}
.fa{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--b);align-items:center}.err{color:#d33;margin-right:auto}
</style></head><body>
<header><h1>Training Matrix</h1><nav id="nav"><button data-t="emp" class="on">Employees</button><button data-t="crs">Courses</button><button data-t="pkg">Packages</button></nav><span class="sp"></span><button class="s" id="exp">Export CSV</button><button class="s" id="bk" title="Download all data as JSON">Backup</button><button class="s" id="rs">Restore</button><button class="s" id="rst">Reset</button><input type="file" id="fi" accept=".json" hidden><button class="p" id="add">+ Add employee</button></header>
<div class="bar" id="bar"></div><div class="sum" id="sum"></div>
<div class="main"><div class="card"><div class="scroll" id="list"></div></div><div class="card"><div class="scroll" id="panel"></div></div></div>
<dialog id="dlg"><div class="ph"><h2 id="dt">Add employee</h2><div class="m">Courses are assigned automatically from the package(s) and region.</div></div>
<div class="fg">

<label>Designation<input id="f_des"></label><label>Email<input id="f_em" type="email"></label>
<label>Department<input id="f_dept" list="dl_dept"></label><label>Region *<select id="f_reg"></select></label>

<label>Grade *<select id="f_gr"></select></label><label>Group<select id="f_grp"></select></label>
<label class="full">Package N * (Ctrl/Cmd-click for several, e.g. 24 + 41)<select id="f_pk" multiple size="7"></select></label>
<div class="full m" id="f_prev"></div></div>
<div class="fa"><span class="err" id="f_err"></span><button class="s" id="f_x">Cancel</button><button class="p" id="f_ok">Add</button></div></dialog>
<datalist id="dl_dept"></datalist><datalist id="dl_cd"></datalist>
<dialog id="dlg2"><div class="ph"><h2 id="ct">Course</h2></div><div class="fg">
<label>Ref *<input id="c_ref"></label><label>Department<input id="c_dept" list="dl_cd"></label>
<label class="full">Name *<input id="c_name"></label>
<label>Region<input id="c_reg" placeholder="ALL, UAE, EGP..."></label><label>Target<input id="c_tg" placeholder="1W"></label>
<label>Max duration<input id="c_du" placeholder="5M"></label>
<label class="full">Packages that require it (Ctrl/Cmd-click for several)<select id="c_pk" multiple size="7"></select></label></div>
<div class="fa"><span class="err" id="c_err"></span><button class="s" id="c_x">Cancel</button><button class="p" id="c_ok">Save</button></div></dialog>

function render(){bar();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#exp').style.display=tab==='emp'?'':'none';$('#add').textContent={emp:'+ Add employee',crs:'+ Add course',pkg:'+ Add package'}[tab];
tab==='emp'?rEmp():tab==='crs'?rCrs():rPkg()}
function rEmp(){const L=filt();$('#sum').innerHTML=`<b>${L.length}</b> of ${all().length} employees`;
$('#list').innerHTML=`<table><tr><th>Name<th>Emp no.<th>Designation<th>Dept<th>Grade<th>Region<th>Group<th>Pkg<th>Courses</tr>`+L.slice(0,lim).map((e,i)=>`<tr class="r${e===sel?' sel':''}" data-i="${i}"><td>${esc(e.n)}${e.added?' <span class="tag w">new</span>':''}<td>${esc(e.no)}<td>${esc(e.des)}<td>${esc(e.dept)}<td>${esc(e.gr)}<td>${esc(e.reg)}<td>${esc(e.grp)}<td>${esc(e.pk)}<td>${cs(e).length}</tr>`).join('')+`</table>`+(L.length>lim?`<div class="more"><button class="s" id="more">Show all ${L.length}</button></div>`:'');
window._L=L;panelEmp(L)}
function crow(ci,extra){const c=C[ci];return `<div class="ci"><div><b>${esc(c.ref)}</b> ${esc(c.name)}<div class="m">${esc(c.dept)} · ${esc(c.region||'—')} · target ${esc(c.target||'—')} · max ${esc(c.dur||'—')}</div></div>${extra||''}</div>`}
function panelEmp(L){const p=$('#panel');if(sel&&all().includes(sel)){const e=sel,c=cs(e);p.innerHTML=`<div class="ph"><h2>${esc(e.n)}</h2><div class="m">${esc(e.no)} · ${esc(e.des)}<br>${esc(e.em)}<br>LM: ${esc(e.lm)} ${esc(e.lme)}<br>Grade ${esc(e.gr)} · ${esc(e.reg)} · ${esc(e.grp)} · Package ${esc(e.pk)}</div><p><b>${c.length}</b> courses <button class="s" id="back">← back to selection</button> <button class="s" id="edit">Edit</button> <button class="s" id="del">Delete</button></p></div>`+c.map(ci=>crow(ci)).join('');return}
const n={};L.forEach(e=>cs(e).forEach(ci=>n[ci]=(n[ci]||0)+1));const k=Object.keys(n).map(Number).sort((a,b)=>n[b]-n[a]||a-b),full=k.filter(ci=>n[ci]==L.length).length;
p.innerHTML=`<div class="ph"><h2>Courses for this selection</h2><div class="m">${k.length} courses · <b>${full}</b> apply to all ${L.length} employees. Click an employee for their own list.</div></div>`+k.map(ci=>crow(ci,`<span class="tag ${n[ci]==L.length?'g':''}">${n[ci]==L.length?'all':n[ci]+' / '+L.length}</span>`)).join('')}
function rCrs(){const q=(F.cq||'').toLowerCase(),E=all();const L=D.courses.map(c=>c.id).filter(i=>{const c=C[i];return(!q||(c.ref+' '+c.name).toLowerCase().includes(q))&&(!F.cd||c.dept==F.cd)&&(!F.cr||c.region==F.cr)});
$('#sum').innerHTML=`<b>${L.length}</b> of ${D.courses.length} courses`;
const pk=ci=>D.groups.filter(g=>g.c.includes(ci)).map(g=>g.id);
$('#list').innerHTML=`<table><tr><th>Ref<th>Course<th>Dept<th>Region<th>Target<th>Max<th>Pkgs</tr>`+L.map(i=>{const c=C[i];return `<tr class="r${i===selC?' sel':''}" data-c="${i}"><td>${esc(c.ref)}<td>${esc(c.name)}<td>${esc(c.dept)}<td>${esc(c.region)}<td>${esc(c.target)}<td>${esc(c.dur)}<td>${pk(i).length}</tr>`}).join('')+'</table>';
const p=$('#panel');if(selC==null){p.innerHTML='<div class="ph m">Select a course to see which packages and employees require it.</div>';return}
const c=C[selC],E2=E.filter(e=>cs(e).includes(selC));p.innerHTML=`<div class="ph"><h2>${esc(c.ref)} · ${esc(c.name)}</h2><div class="m">${esc(c.dept)} · ${esc(c.region||'—')} · target ${esc(c.target||'—')} · max ${esc(c.dur||'—')}</div><p>Packages: ${pk(selC).map(i=>`<span class="tag">${i} ${esc(G[i].name)}</span>`).join(' ')||'none'}</p><p><button class="s" id="cedit">Edit</button> <button class="s" id="cdel">Delete</button></p><p><b>${E2.length}</b> employees${E2.length>150?' (first 150)':''}</p></div>`+E2.slice(0,150).map(e=>`<div class="ci"><div>${esc(e.n)}<div class="m">${esc(e.des)} · ${esc(e.reg)}</div></div><span class="tag">Gr ${esc(e.gr)}</span></div>`).join('')}
let selP=null,pq='';
function rPkg(){const E=all();$('#sum').innerHTML=`<b>${D.groups.length}</b> packages (user groups)`;
$('#list').innerHTML=`<table><tr><th>#<th>Name<th>Grades / people<th>Courses<th>Employees</tr>`+D.groups.map(g=>`<tr class="r${g.id===selP?' sel':''}" data-p="${g.id}"><td>${g.id}<td>${esc(g.name)}<td>${esc(String(g.m||'').split('\n').join(', '))}<td>${g.c.length}<td>${E.filter(e=>ids(e.pk).includes(g.id)).length}</tr>`).join('')+'</table>';panelPkg()}
function courseChecks(g){const q=pq.toLowerCase();return D.courses.filter(c=>!q||(c.ref+' '+c.name).toLowerCase().includes(q)).map(c=>`<label class="ci" style="cursor:pointer"><span><input type="checkbox" data-pc="${c.id}"${g.c.includes(c.id)?' checked':''}> <b>${esc(c.ref)}</b> ${esc(c.name)}</span><span class="m">${esc(c.region||'-')}</span></label>`).join('')}
function panelPkg(){const p=$('#panel'),g=G[selP];if(!g){p.innerHTML='<div class="ph m">Select a package to edit its name, members and courses.</div>';return}
p.innerHTML=`<div class="ph"><h2>Package ${g.id}</h2><label class="m">Name<br><input id="pn" value="${esc(g.name)}"></label><br><label class="m">Grades / people<br><textarea id="pm" rows="3" style="width:100%">${esc(g.m)}</textarea></label><p><button class="s" id="pe">View its employees</button> <button class="s" id="pd">Delete package</button></p><input type="search" id="pcq" placeholder="Filter courses..." value="${esc(pq)}" style="width:100%"><div class="m" style="margin-top:6px"><b id="pcn">${g.c.length}</b> courses ticked - changes save instantly</div></div><div id="pcl">${courseChecks(g)}</div>`}
function addPkg(){const n=prompt('New package name (e.g. DES-NEW)');if(!n)return;const id=Math.max(0,...D.groups.map(g=>g.id))+1;D.groups.push({id,name:n,m:'',c:[]});rebuild();save();selP=id;rPkg()}
document.addEventListener('input',ev=>{const f=ev.target.dataset&&ev.target.dataset.f;if(!f)return;const v=ev.target.type=='checkbox'?ev.target.checked:ev.target.value;
if(f=='cq')F.cq=v;else if(f=='cd')F.cd=v;else if(f=='cr')F.cr=v;else F[f]=v;sel=null;lim=200;if(ev.target.type=='search'){const s=ev.target.selectionStart;(tab=='emp'?rEmp:rCrs)();return}render()});
document.addEventListener('click',ev=>{const t=ev.target,tr=t.closest('tr.r');
if(t.closest('nav button')){tab=t.closest('nav button').dataset.t;render();return}
if(t.id=='clr'){F={q:'',grp:'',gr:'',pk:'',reg:'',dept:'',added:false};sel=null;render();return}
if(t.id=='more'){lim=1e9;rEmp();return}if(t.id=='back'){sel=null;panelEmp(window._L);rEmp();return}
if(t.id=='del'&&confirm('Delete '+sel.n+'?')){D.employees=D.employees.filter(e=>e!==sel);save();sel=null;render();return}
if(tr&&tr.dataset.i!=null){sel=window._L[tr.dataset.i];rEmp();return}
if(tr&&tr.dataset.c!=null){selC=+tr.dataset.c;rCrs();return}
if(tr&&tr.dataset.p){selP=+tr.dataset.p;rPkg();return}
if(t.id=='pe'){F.pk=String(selP);tab='emp';sel=null;render();return}
if(t.id=='pd'){const n=all().filter(e=>ids(e.pk).includes(selP)).length;if(confirm('Delete package '+selP+'?'+(n?' '+n+' employees still reference it.':''))){D.groups=D.groups.filter(g=>g.id!=selP);selP=null;rebuild();save();rPkg()}return}
if(t.id=='edit'){openEmp(sel);return}
if(t.id=='cedit'){openCrs(C[selC]);return}
if(t.id=='cdel'&&confirm('Delete course '+C[selC].ref+'?')){const id=selC;D.courses=D.courses.filter(c=>c.id!=id);D.groups.forEach(g=>g.c=g.c.filter(x=>x!=id));selC=null;rebuild();save();render();return}});
$('#exp').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const L=filt();
const rows=[['Name','Employee Number','Designation','Email','Department','Line Manager','LM Email','Grade','Region','Group','Package.N','Courses']].concat(L.map(e=>[e.n,e.no,e.des,e.em,e.dept,e.lm,e.lme,e.gr,e.reg,e.grp,e.pk,cs(e).map(i=>C[i].ref).join(' ')]));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='training_matrix_export.csv';a.click()};
// add employee
const dlg=$('#dlg'),fv=i=>$('#f_'+i).value.trim();
function prev(){const pk=[...$('#f_pk').selectedOptions].map(o=>o.value).join('-');if(!pk){$('#f_prev').textContent='';return}const e={pk,reg:fv('reg')};$('#f_prev').innerHTML=`→ <b>${cs(e).length}</b> courses will be assigned.`}
let editE=null;
function openEmp(e){editE=e||null;$('#dt').textContent=e?'Edit employee':'Add employee';$('#f_ok').textContent=e?'Save':'Add';
$('#f_gr').innerHTML=opts(GR,e&&e.gr);$('#f_reg').innerHTML=opts(Object.keys(RC),e&&e.reg);$('#f_grp').innerHTML='<option value="">-</option>'+opts(uniq(all(),'grp'),e&&e.grp);
const cur=e?ids(e.pk):[];$('#f_pk').innerHTML=D.groups.map(g=>`<option value="${g.id}"${cur.includes(g.id)?' selected':''}>${g.id} · ${esc(g.name)} (${esc(String(g.m||'').split('\n')[0].slice(0,30))})</option>`).join('');
$('#dl_dept').innerHTML=opts(uniq(all(),'dept'));['n','no','des','em','dept','lm','lme'].forEach(i=>$('#f_'+i).value=e?e[i]:'');$('#f_err').textContent='';prev();dlg.showModal()}
$('#f_pk').onchange=$('#f_reg').onchange=prev;$('#f_x').onclick=()=>dlg.close();
$('#f_ok').onclick=()=>{const pk=[...$('#f_pk').selectedOptions].map(o=>+o.value).sort((a,b)=>a-b).join('-'),er=$('#f_err');
if(!fv('n'))return er.textContent='Name is required.';if(!pk)return er.textContent='Choose at least one package.';
if(fv('no')&&all().some(e=>e!==editE&&e.no.toLowerCase()==fv('no').toLowerCase()))return er.textContent='Employee number already exists.';
const e={n:fv('n'),no:fv('no'),des:fv('des'),em:fv('em'),dept:fv('dept'),lm:fv('lm'),lme:fv('lme'),gr:fv('gr'),reg:fv('reg'),grp:fv('grp'),pk,added:true};
if(editE){const a=editE.added;Object.assign(editE,e,{added:a});delete editE._c;sel=editE}else{D.employees.push(e);sel=e;F={q:'',grp:'',gr:'',pk:'',reg:'',dept:'',added:false}}
save();dlg.close();tab='emp';render()};
const dlg2=$('#dlg2');let editC=null;
function openCrs(c){editC=c||null;$('#ct').textContent=c?'Edit course':'Add course';
[['ref','ref'],['dept','dept'],['name','name'],['reg','region'],['tg','target'],['du','dur']].forEach(([i,k])=>$('#c_'+i).value=c?c[k]:'');
$('#dl_cd').innerHTML=opts([...new Set(D.courses.map(c=>c.dept))].sort());
$('#c_pk').innerHTML=D.groups.map(g=>`<option value="${g.id}"${c&&g.c.includes(c.id)?' selected':''}>${g.id} · ${esc(g.name)}</option>`).join('');$('#c_err').textContent='';dlg2.showModal()}
$('#c_x').onclick=()=>dlg2.close();
$('#c_ok').onclick=()=>{const v=i=>$('#c_'+i).value.trim();if(!v('ref')||!v('name'))return $('#c_err').textContent='Ref and name are required.';
const c=editC||{id:Math.max(-1,...D.courses.map(x=>x.id))+1};Object.assign(c,{ref:v('ref'),name:v('name'),dept:v('dept'),region:v('reg'),target:v('tg'),dur:v('du')});
if(!editC)D.courses.push(c);const sp=[...$('#c_pk').selectedOptions].map(o=>+o.value);D.groups.forEach(g=>{g.c=g.c.filter(x=>x!=c.id);if(sp.includes(g.id))g.c.push(c.id)});
rebuild();save();dlg2.close();tab='crs';selC=c.id;render()};
$('#add').onclick=()=>tab=='emp'?openEmp():tab=='crs'?openCrs():addPkg();
$('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,(k,v)=>k=='_c'?undefined:v)],{type:'application/json'}));a.download='training_matrix_backup.json';a.click()};
$('#rs').onclick=()=>$('#fi').click();
$('#fi').onchange=async ev=>{try{const d=JSON.parse(await ev.target.files[0].text());if(!d.courses||!d.groups||!d.employees)throw 0;D=d;D.courses.forEach((c,i)=>{if(c.id==null)c.id=i});rebuild();save();sel=selC=selP=null;render()}catch(x){alert('Not a valid backup file.')}ev.target.value=''};
$('#rst').onclick=()=>{if(confirm('Discard ALL edits and go back to the original spreadsheet data?')){D=JSON.parse(JSON.stringify(D0));D.courses.forEach((c,i)=>c.id=i);rebuild();save();sel=selC=selP=null;render()}};
document.addEventListener('input',ev=>{const t=ev.target,g=G[selP];
if(t.id=='pn'&&g)g.name=t.value;else if(t.id=='pm'&&g)g.m=t.value;
else if(t.id=='pcq'&&g){pq=t.value;$('#pcl').innerHTML=courseChecks(g);return}
else if(t.dataset&&t.dataset.pc!=null&&g){const id=+t.dataset.pc;g.c=t.checked?[...new Set([...g.c,id])]:g.c.filter(x=>x!=id);D.employees.forEach(e=>delete e._c);$('#pcn').textContent=g.c.length}else return;save()});
document.addEventListener('change',ev=>{if(['pn','pm'].includes(ev.target.id))rPkg()});
render();
</script></body></html>
